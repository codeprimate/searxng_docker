use_default_settings:
  engines:
    # --- Removed 2026-09-15: permanently unusable in this environment ---
    #   torch  : xpath engine aimed at a .onion address. Requires Tor. SearXNG
    #            auto-deactivates it, logging "can't register engine" every boot.
    #   ahmia  : Tor hidden-service index. Requires Tor.
    #   yacy   : P2P index. Requires a reachable public peer; it timed out on
    #            every single query before removal.
    remove:
      - torch
      - ahmia
      - yacy
      - yacy images

general:
  debug: false
  instance_name: "SearXNG"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

bot_detection:
  enabled: false

brand:
  public_instances: ""

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json
  default_doi_resolver: "doi.org"

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: "${SEARXNG_BASE_URL}"
  image_proxy: false
  http_protocol_version: "1.0"
  method: "POST"
  secret_key: "${SEARXNG_SECRET_KEY}"
  limiter: false

ui:
  static_use_hash: false
  default_locale: "en"
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  cache_url: "${SEARXNG_BASE_URL}static/cache/"
  default_theme: "simple"
  theme_args:
    simple_style: "auto"

valkey:
  url: "redis://redis:6379/0"

outgoing:
  request_timeout: 2.0
  max_request_timeout: 3.0
  useragent_suffix: "SearXNG"
  pool_connections: 100
  pool_maxsize: 100
  enable_http2: true
  max_retries: 0

engines:
  # Each entry here overrides the same-named engine from the image's defaults.
  # Keep this list to engines we deliberately re-enable or re-tune; everything
  # else inherits upstream's defaults.
  - name: bing
    engine: bing
    shortcut: bi
    categories: general
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: general
    disabled: false

  - name: google
    engine: google
    shortcut: go
    categories: general
    disabled: false

  # --- Independent indexes, enabled 2026-09-15 after isolation testing. ---
  # Your working set must be counted in distinct *indexes*, not engine names:
  # duckduckgo is Bing-derived and google cse is Google, so those two pairs are
  # really two indexes. These three run their own crawls and were each verified
  # returning results. Together with Bing and Google that is five independent
  # indexes, so losing one cannot drop the instance below its floor of three.
  - name: yep
    disabled: false
  - name: wiby
    disabled: false
  - name: mwmbl
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    categories: general
    disabled: false

  - name: wikidata
    engine: wikidata
    shortcut: wd
    categories: general
    disabled: false

  - name: github
    engine: github
    shortcut: gh
    categories: it
    disabled: false

  - name: youtube
    engine: youtube_noapi
    shortcut: yt
    categories: videos
    disabled: false

  - name: vimeo
    engine: vimeo
    shortcut: vi
    categories: videos
    disabled: false

  - name: stackexchange
    engine: stackexchange
    shortcut: sx
    categories: it
    disabled: false

# --- Removed 2026-09-15, recorded so it is not re-added blindly ---
#   startpage : upstream sets `inactive: true` ("uses a Proof Of Work captcha",
#               searxng/searxng#6669). The old block here set disabled:false but
#               never overrode inactive, so it registered nothing at all — dead
#               config that merely looked like an enabled engine. An entry under
#               use_default_settings.engines.remove would not help: the engine is
#               already skipped before removal is applied.
#   ahmia, yacy, yacy images : see use_default_settings.engines.remove above.
#   qwant   : TRIED 2026-09-15 — returns "CAPTCHA" to this host. Rejected.
#   mojeek  : TRIED 2026-09-15 — serves a <title>Captcha</title> page and its
#             engine does not detect it, so it returns zero results silently
#             rather than reporting an error. Rejected; a silent engine is worse
#             than a failing one.
#   brave   : kept enabled. Genuinely independent index, healthy in normal use;
#             its "too many requests" state is transient rate-limiting and
#             clears on its own. SearXNG simply skips it while suspended.
